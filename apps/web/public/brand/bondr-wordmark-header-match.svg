<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">BONDR header-style wordmark</title>
  <desc id="desc">Header-matched BONDR wordmark with compact spy-terminal scope O using black, linen, and restrained tangerine.</desc>
  <rect width="900" height="220" fill="#000000"/>
  <g transform="translate(56 48)">
    <rect x="0" y="0" width="520" height="112" rx="18" fill="#000000" stroke="rgba(249,235,224,.14)"/>
    <g transform="translate(28 27) scale(.92 1)">
      <text x="0" y="48" fill="#F9EBE0" font-family="Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="950" letter-spacing="4">B</text>
      <g transform="translate(54 4) scale(1.087 1)">
        <circle cx="26" cy="26" r="23" fill="#000000" stroke="#F9EBE0" stroke-opacity=".82" stroke-width="3"/>
        <line x1="26" y1="15" x2="26" y2="37" stroke="#FF7F11" stroke-opacity=".76" stroke-width="2" stroke-linecap="round"/>
        <line x1="15" y1="26" x2="37" y2="26" stroke="#FF7F11" stroke-opacity=".76" stroke-width="2" stroke-linecap="round"/>
        <circle cx="26" cy="26" r="2.6" fill="#FF7F11" fill-opacity=".88"/>
      </g>
      <text x="114" y="48" fill="#F9EBE0" font-family="Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="950" letter-spacing="4">NDR</text>
    </g>
    <text x="30" y="86" fill="#F9EBE0" fill-opacity=".58" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4">BOND.TERMINAL</text>
  </g>
</svg>
