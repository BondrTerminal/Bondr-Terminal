<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">BONDR wordmark</title>
  <desc id="desc">Custom BONDR wordmark with spy-terminal scope style O, using black, linen, and restrained tangerine.</desc>
  <rect width="720" height="180" fill="#000000"/>
  <g transform="translate(38 34)">
    <text x="0" y="80" fill="#F9EBE0" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="6" transform="scale(.92 1)">B</text>
    <g transform="translate(82 8)">
      <circle cx="43" cy="43" r="36" fill="#000000" stroke="#F9EBE0" stroke-width="5"/>
      <circle cx="43" cy="43" r="7" fill="#FF7F11"/>
      <line x1="43" y1="10" x2="43" y2="28" stroke="#FF7F11" stroke-width="4" stroke-linecap="round"/>
      <line x1="43" y1="58" x2="43" y2="76" stroke="#FF7F11" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="43" x2="28" y2="43" stroke="#FF7F11" stroke-width="4" stroke-linecap="round"/>
      <line x1="58" y1="43" x2="76" y2="43" stroke="#FF7F11" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="176" y="80" fill="#F9EBE0" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="6" transform="scale(.92 1)">NDR</text>
    <text x="2" y="124" fill="rgba(249,235,224,.68)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="7">BOND.TERMINAL</text>
    <line x1="0" y1="143" x2="408" y2="143" stroke="#F9EBE0" stroke-opacity=".22"/>
    <line x1="0" y1="143" x2="56" y2="143" stroke="#FF7F11" stroke-width="2"/>
  </g>
</svg>
